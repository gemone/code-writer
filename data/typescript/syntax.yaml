# TypeScript Syntax Seed
# Minimal seed — comprehensive data auto-fetched via lang_fetch

syntax:

  Variables:

    TypeAnnotations:
      description: "Explicit type annotations for variables, arrays, and tuples."
      example: |
        const name: string = "Alice";
        const count: number = 42;
        const items: string[] = ["a", "b"];
        const pair: [string, number] = ["key", 1];

    UnionAndIntersection:
      description: "Combine types with union (|) for OR logic and intersection (&) for AND logic."
      example: |
        type Status = "pending" | "active" | "done";
        type WithTimestamp = { createdAt: Date };
        type UserEntity = { id: string } & WithTimestamp;

    Generics:
      description: "Parameterized types for reusable, type-safe abstractions."
      example: |
        function identity<T>(value: T): T { return value; }
        interface Repository<T> {
          findById(id: string): Promise<T | null>;
        }

  Functions:

    Signatures:
      description: "Function type aliases and callable interfaces."
      example: |
        type Comparator<T> = (a: T, b: T) => number;
        const sort: Comparator<string> = (a, b) => a.localeCompare(b);

    ArrowFunctions:
      description: "Arrow syntax with type annotations for callbacks and inline logic."
      example: |
        const add = (a: number, b: number): number => a + b;
        const names = users.map((u) => u.name);

    RestAndDefault:
      description: "Rest parameters and default values."
      example: |
        function log(level: string, ...messages: string[]): void {
          console.log(`[${level}]`, ...messages);
        }
        function fetch(url: string, timeout = 5000): Promise<Response> { /* ... */ }

  Classes:

    Constructors:
      description: "Classes with parameter properties and access modifiers."
      example: |
        class User {
          constructor(
            public readonly id: string,
            public name: string,
            private email: string,
          ) {}
        }

    AbstractAndImplements:
      description: "Abstract base classes and interface implementation."
      example: |
        interface Logger { info(msg: string): void; }
        abstract class BaseLogger implements Logger {
          constructor(protected prefix: string) {}
          info(msg: string): void { console.log(`[${this.prefix}] ${msg}`); }
        }
        class AppLogger extends BaseLogger {}

  Interfaces:

    Declaration:
      description: "Interface declaration and extension for object shapes."
      example: |
        interface Entity { id: string; createdAt: Date; }
        interface User extends Entity { name: string; email: string; }

    IndexSignatures:
      description: "Dynamic key types with index signatures."
      example: |
        interface StringMap { [key: string]: string; }
        type Cache<T> = Record<string, T>;

  Async:

    Promises:
      description: "Promise creation, chaining, and async/await syntax."
      example: |
        async function fetchUser(id: string): Promise<User> {
          const res = await fetch(`/api/users/${id}`);
          if (!res.ok) throw new Error(`User ${id} not found`);
          return res.json();
        }

    PromiseCombinators:
      description: "Promise.all, allSettled, race, any for concurrent operations."
      example: |
        const [users, posts] = await Promise.all([
          fetchUsers(),
          fetchPosts(),
        ]);
        const results = await Promise.allSettled(items.map(process));
