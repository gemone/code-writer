# TypeScript Patterns Seed
# Minimal seed — comprehensive data auto-fetched via lang_fetch

patterns:

  - name: Module Pattern
    category: structural
    description: >
      Encapsulate related functionality using ES modules with named exports.
      Provides clear public API boundaries and enables tree-shaking.
    when:
      - "Organizing code into cohesive units with a defined public API."
      - "Separating concerns into testable, importable modules."
    example: |
      // user-service.ts
      export async function findById(id: string): Promise<User | null> { /* ... */ }
      export async function create(data: CreateUserDTO): Promise<User> { /* ... */ }
    relatedPatterns:
      - "Factory Pattern"
      - "Singleton Pattern"

  - name: Singleton Pattern
    category: creational
    description: >
      Restrict a class to a single instance with a private constructor and
      static accessor. Useful for shared resources like database connections.
    when:
      - "Exactly one instance must exist across the application."
      - "Managing shared state or expensive resources."
    example: |
      class Database {
        private static instance: Database;
        private constructor(private url: string) {}
        static getInstance(url: string): Database {
          if (!Database.instance) Database.instance = new Database(url);
          return Database.instance;
        }
      }
    relatedPatterns:
      - "Module Pattern"
      - "Factory Pattern"

  - name: Observer Pattern
    category: behavioral
    description: >
      One-to-many dependency where subscribers are notified of state changes.
      Enables loose coupling between producers and consumers of events.
    when:
      - "Decoupling event producers from consumers."
      - "Implementing pub/sub or event systems."
    example: |
      type Listener<T> = (value: T) => void;
      class EventEmitter<T = void> {
        private listeners = new Set<Listener<T>>();
        on(fn: Listener<T>): () => void { this.listeners.add(fn); return () => this.listeners.delete(fn); }
        emit(value: T): void { this.listeners.forEach((fn) => fn(value)); }
      }
    relatedPatterns:
      - "Middleware Pattern"
      - "Promise Chain"

  - name: Factory Pattern
    category: creational
    description: >
      Delegate object creation to a factory function, encapsulating
      instantiation logic and enabling dependency injection.
    when:
      - "Object creation requires configuration or conditional logic."
      - "Decoupling creation from usage for testability."
    example: |
      type StorageFactory = () => Storage;
      function createStorage(type: "local" | "s3"): Storage {
        return type === "local" ? new LocalStorage() : new S3Storage();
      }
    relatedPatterns:
      - "Singleton Pattern"
      - "Module Pattern"

  - name: Promise Chain
    category: behavioral
    description: >
      Sequence asynchronous operations using .then() chains or async/await.
      Each step transforms the result and passes it to the next.
    when:
      - "Composing multiple async operations in sequence."
      - "Transforming data through an async pipeline."
    example: |
      async function processOrder(order: Order): Promise<Invoice> {
        const validated = await validateOrder(order);
        const reserved = await reserveInventory(validated);
        const charged = await processPayment(reserved);
        return generateInvoice(charged);
      }
    relatedPatterns:
      - "Observer Pattern"
      - "Middleware Pattern"
