# TypeScript Standard Library Reference
# Minimal seed - use lang_fetch to populate comprehensive data

stdlib:
  Array:
    description: "Ordered collection with indexed access and a rich set of iteration and transformation methods."
    methods:
      - name: map
        signature: "<U>(callbackfn: (value: T, index: number, array: T[]) => U): U[]"
        description: "Transform each element using a mapping function and return a new array."
        returns: "U[]"
        example: |
          const names = ["Alice", "Bob"];
          const upper = names.map((name) => name.toUpperCase());
          // ["ALICE", "BOB"]
        tags: [transformation, immutable]
      - name: filter
        signature: "(predicate: (value: T, index: number, array: T[]) => boolean): T[]"
        description: "Return a new array containing elements that pass the predicate test."
        returns: "T[]"
        example: |
          const numbers = [1, 2, 3, 4, 5];
          const evens = numbers.filter((n) => n % 2 === 0);
          // [2, 4]
        tags: [filtering, immutable]
      - name: reduce
        signature: "<U>(callbackfn: (previousValue: U, currentValue: T, currentIndex: number, array: T[]) => U, initialValue: U): U"
        description: "Reduce the array to a single value by accumulating results from left to right."
        returns: "U"
        example: |
          const numbers = [1, 2, 3, 4, 5];
          const sum = numbers.reduce((acc, n) => acc + n, 0);
          // 15
        tags: [aggregation, transformation]

  Promise:
    description: "Asynchronous computation that eventually resolves to a value or rejects with an error."
    methods:
      - name: all
        signature: "<T>(values: Iterable<T | PromiseLike<T>>): Promise<Awaited<T>[]>"
        description: "Wait for all promises to resolve. Rejects immediately on the first rejection."
        returns: "Promise<Awaited<T>[]>"
        example: |
          const [users, posts] = await Promise.all([
            fetchUsers(),
            fetchPosts(),
          ]);
        tags: [async, parallel]
      - name: allSettled
        signature: "<T>(values: Iterable<T | PromiseLike<T>>): Promise<PromiseSettledResult<Awaited<T>>[]>"
        description: "Wait for all promises to settle (resolve or reject). Never rejects."
        returns: "Promise<PromiseSettledResult<Awaited<T>>[]>"
        example: |
          const results = await Promise.allSettled([
            fetchFromPrimary(),
            fetchFromCache(),
          ]);
          const successful = results
            .filter((r): r is PromiseFulfilledResult<Data> => r.status === "fulfilled")
            .map((r) => r.value);
        tags: [async, resilient]
      - name: race
        signature: "<T>(values: Iterable<T | PromiseLike<T>>): Promise<Awaited<T>>"
        description: "Return the first promise to settle (resolve or reject)."
        returns: "Promise<Awaited<T>>"
        example: |
          const timeout = new Promise<never>((_, reject) =>
            setTimeout(() => reject(new Error("Timeout")), 5000)
          );
          const result = await Promise.race([fetchData(), timeout]);
        tags: [async, race]

  Map:
    description: "Key-value collection that preserves insertion order and supports any key type."
    methods:
      - name: set
        signature: "(key: K, value: V): this"
        description: "Set a key-value pair. Overwrites if key exists. Returns the map for chaining."
        returns: "this"
        example: |
          const config = new Map<string, string>();
          config.set("host", "localhost").set("port", "3000");
        tags: [mutation]
      - name: get
        signature: "(key: K): V | undefined"
        description: "Return the value for the given key, or undefined if not found."
        returns: "V | undefined"
        example: |
          const env = new Map([["NODE_ENV", "production"]]);
          env.get("NODE_ENV"); // "production"
        tags: [access]
      - name: has
        signature: "(key: K): boolean"
        description: "Return true if the map contains the given key."
        returns: "boolean"
        example: |
          const cache = new Map<string, unknown>();
          cache.set("user:1", { name: "Alice" });
          cache.has("user:1"); // true
        tags: [testing]

  String:
    description: "Built-in string object with methods for text manipulation and searching."
    methods:
      - name: split
        signature: "(separator: string | RegExp, limit?: number): string[]"
        description: "Split the string into an array of substrings using the separator."
        returns: "string[]"
        example: |
          const csv = "red,green,blue";
          const colors = csv.split(",");
          // ["red", "green", "blue"]
        tags: [splitting, transformation]
      - name: includes
        signature: "(searchString: string, position?: number): boolean"
        description: "Return true if the string contains the search string."
        returns: "boolean"
        example: |
          const message = "Hello, World!";
          message.includes("World"); // true
        tags: [search, boolean]
      - name: replaceAll
        signature: "(pattern: string | RegExp, replacement: string): string"
        description: "Replace all occurrences of a pattern with the replacement string."
        returns: "string"
        example: |
          const template = "Hello {name}! Welcome to {place}.";
          const result = template.replaceAll("{name}", "Alice").replaceAll("{place}", "NYC");
        tags: [transformation, replacement]

  JSON:
    description: "Methods for parsing and serializing JSON data."
    methods:
      - name: parse
        signature: "(text: string, reviver?: (key: string, value: unknown) => unknown): unknown"
        description: "Parse a JSON string into a JavaScript value."
        returns: "unknown"
        example: |
          const data = JSON.parse('{"name": "Alice", "age": 30}') as {
            name: string;
            age: number;
          };
        tags: [serialization, deserialization]
      - name: stringify
        signature: "(value: unknown, replacer?: ((key: string, value: unknown) => unknown) | null, space?: string | number): string"
        description: "Serialize a JavaScript value to a JSON string."
        returns: "string"
        example: |
          const user = { name: "Alice", age: 30 };
          JSON.stringify(user, null, 2);
          // {\n  "name": "Alice",\n  "age": 30\n}
        tags: [serialization]
