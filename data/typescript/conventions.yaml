# TypeScript Conventions Seed
# Minimal seed — comprehensive data auto-fetched via lang_fetch

conventions:

  - id: camelCase-vars
    rule: "Use camelCase for variables, functions, and parameters."
    severity: error
    good:
      example: |
        const userName = "Alice";
        const isActive = true;
        function calculateTotal(items: Item[]): number { /* ... */ }
    bad:
      example: |
        const user_name = "Alice";
        const is_active = true;
        function Calculate_Total(items: Item[]) { /* ... */ }

  - id: pascalCase-types
    rule: "Use PascalCase for classes, interfaces, types, and enums."
    severity: error
    good:
      example: |
        class UserService { /* ... */ }
        interface UserProfile { /* ... */ }
        type NetworkStatus = "online" | "offline";
    bad:
      example: |
        class userService { /* ... */ }
        interface userProfile { /* ... */ }
        type networkStatus = "online" | "offline";

  - id: upper-snake-constants
    rule: "Use UPPER_SNAKE_CASE for true constants and environment variables."
    severity: warn
    good:
      example: |
        const MAX_RETRIES = 3;
        const API_BASE_URL = "https://api.example.com";
    bad:
      example: |
        const maxRetries = 3;
        const apiBaseUrl = "https://api.example.com";

  - id: const-over-let
    rule: "Use const by default; only use let when reassignment is necessary."
    severity: error
    rationale: "Signals intent and prevents accidental reassignment."
    good:
      example: |
        const apiUrl = "https://api.example.com";
        let count = 0;
        for (const item of items) { count++; }
    bad:
      example: |
        let apiUrl = "https://api.example.com";
        let users = fetchUsers();
        var count = 0;

  - id: interface-over-type
    rule: "Prefer interface over type alias for object shapes. Use type for unions."
    severity: warn
    good:
      example: |
        interface User { id: string; name: string; }
        type Status = "active" | "inactive";
    bad:
      example: |
        type User = { id: string; name: string; };

  - id: explicit-return-types
    rule: "Add explicit return types to exported and public functions."
    severity: warn
    good:
      example: |
        export function add(a: number, b: number): number { return a + b; }
        export async function fetchUser(id: string): Promise<User | null> { /* ... */ }
    bad:
      example: |
        export function add(a: number, b: number) { return a + b; }

  - id: optional-chaining
    rule: "Use optional chaining (?.) and nullish coalescing (??) for nullable access."
    severity: error
    good:
      example: |
        const city = user.address?.city ?? "Unknown";
        const length = items?.length ?? 0;
    bad:
      example: |
        const city = user.address ? user.address.city : "Unknown";
        const city = user.address!.city;

  - id: typed-catch
    rule: "Catch errors with proper type narrowing; never leave catch blocks empty."
    severity: error
    good:
      example: |
        try { await save(data); }
        catch (error) {
          if (error instanceof Error) logger.error(error.message);
          throw error;
        }
    bad:
      example: |
        try { await save(data); } catch (e) { /* empty */ }

  - id: no-explicit-any
    rule: "Avoid explicit any. Use unknown for truly unknown types."
    severity: error
    good:
      example: |
        function parse(input: unknown): Data {
          if (typeof input !== "string") throw new TypeError("Expected string");
          return JSON.parse(input) as Data;
        }
    bad:
      example: |
        function parse(input: any): Data { return JSON.parse(input); }

  - id: import-ordering
    rule: "Order imports: node built-ins, external packages, internal modules, relative paths."
    severity: warn
    good:
      example: |
        import { readFile } from "node:fs/promises";
        import express from "express";
        import { config } from "@/config";
        import { helper } from "./utils";
    bad:
      example: |
        import { helper } from "./utils";
        import express from "express";
        import { readFile } from "node:fs/promises";
