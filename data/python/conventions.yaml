# Python Coding Conventions
# Minimal seed - comprehensive data auto-fetched via lang_fetch
# Severity: error (must fix), warn (should fix), info (nice to have)

conventions:
  - id: naming-pep8
    rule: "snake_case for functions/variables, PascalCase for classes, UPPER_SNAKE for constants."
    severity: warn
    rationale: "PEP 8 naming ensures consistency across the Python ecosystem."
    tags: [naming, readability]
    good:
      example: |
        user_name = "Alice"
        MAX_RETRY_COUNT = 3

        def calculate_total(items: list[float]) -> float:
            return sum(items)

        class DatabaseConnection: ...
    bad:
      example: |
        def calculateTotal(items): ...
        class http_request_handler: ...
        max_retry_count = 3

  - id: type-hints-public
    rule: "Type hints on all public function parameters and return values."
    severity: warn
    rationale: "Enables static analysis, IDE autocompletion, and documentation."
    tags: [typing, safety]
    good:
      example: |
        def find_user(email: str) -> User | None: ...
        def process_items(items: list[str], limit: int = 100) -> dict[str, int]: ...
    bad:
      example: |
        def find_user(email): ...
        def process_items(items, limit=100): ...

  - id: prefer-fstrings
    rule: "Use f-strings over .format() and % formatting."
    severity: info
    rationale: "F-strings are more readable, concise, and performant."
    tags: [style, readability]
    good:
      example: |
        greeting = f"Hello, {name}!"
        price = f"${total:.2f}"
        debug = f"{name=}, {age=}"  # Debug format (3.8+)
    bad:
      example: |
        greeting = "Hello, %s!" % name
        greeting = "Hello, {}!".format(name)

  - id: specific-exceptions
    rule: "Catch specific exception types. Never bare except or except Exception."
    severity: error
    rationale: "Broad catches mask bugs. Preserve chains with 'raise ... from e'."
    tags: [error-handling, safety]
    good:
      example: |
        try:
            return json.loads(path.read_text())
        except FileNotFoundError:
            return {}
        except json.JSONDecodeError as e:
            raise ValueError(f"Invalid JSON in {path}: {e}") from e
    bad:
      example: |
        try:
            data = json.load(f)
        except:
            return {}

  - id: no-wildcard-imports
    rule: "Never use 'from module import *'. Import names explicitly."
    severity: error
    rationale: "Wildcard imports pollute namespace and hide dependencies."
    tags: [imports, readability]
    good:
      example: |
        from collections import defaultdict, Counter
        from typing import Optional, Union
    bad:
      example: |
        from os import *
        from math import *

  - id: prefer-list-comprehensions
    rule: "Use comprehensions over map/filter with lambda for simple transforms."
    severity: info
    rationale: "Comprehensions are more Pythonic and readable."
    tags: [style, readability]
    good:
      example: |
        squares = [x ** 2 for x in range(10)]
        evens = [x for x in numbers if x % 2 == 0]
        lengths = {w: len(w) for w in ["hello", "world"]}
    bad:
      example: |
        squares = list(map(lambda x: x ** 2, range(10)))
        evens = list(filter(lambda x: x % 2 == 0, numbers))

  - id: prefer-pathlib
    rule: "Use pathlib.Path over os.path for all path operations."
    severity: warn
    rationale: "Object-oriented, chainable, cross-platform interface."
    tags: [stdlib, readability]
    good:
      example: |
        from pathlib import Path

        config = Path.home() / ".config" / "myapp" / "settings.yaml"
        if config.exists():
            content = config.read_text()

        for py_file in Path("src").glob("**/*.py"):
            print(py_file.name)
    bad:
      example: |
        import os
        config = os.path.join(os.path.expanduser("~"), ".config", "myapp", "settings.yaml")
        if os.path.exists(config):
            with open(config) as f: content = f.read()

  - id: docstrings-public
    rule: "Write docstrings for all public modules, classes, and functions."
    severity: warn
    rationale: "Docstrings are Python's primary documentation mechanism."
    tags: [documentation]
    good:
      example: |
        def calculate_bmi(weight_kg: float, height_m: float) -> float:
            """Calculate Body Mass Index.

            Args:
                weight_kg: Weight in kilograms. Must be positive.
                height_m: Height in meters. Must be positive.

            Returns:
                The calculated BMI value.
            """
            return weight_kg / (height_m ** 2)
    bad:
      example: |
        def calculate_bmi(weight_kg, height_m):
            return weight_kg / (height_m ** 2)

  - id: explicit-return-types
    rule: "Always specify return types on public functions, even when returning None."
    severity: warn
    rationale: "Explicit return types improve docs and type checker coverage."
    tags: [typing, safety]
    good:
      example: |
        def initialize(config: dict) -> None: ...
        def get_user(user_id: int) -> User | None: ...
    bad:
      example: |
        def initialize(config: dict): ...
        def get_user(user_id: int): ...

  - id: import-ordering
    rule: "Group imports: stdlib, third-party, local. Separate with blank lines."
    severity: info
    rationale: "Consistent order improves readability and reveals dependencies."
    tags: [style, imports]
    good:
      example: |
        import json
        from pathlib import Path
        from typing import Optional

        import httpx
        from fastapi import FastAPI

        from .config import settings
        from .models import User
    bad:
      example: |
        from .models import User
        import json
        from fastapi import FastAPI
        import os
