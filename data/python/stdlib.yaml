# Python Standard Library Reference
# Minimal seed - use lang_fetch to populate comprehensive data

version: 1
modules:
  - name: list
    module: list
    category: built-in
    description: Mutable sequence type for storing ordered collections.
    methods:
      - name: append
        signature: "list.append(item: T) -> None"
        description: Add a single item to the end of the list in place.
        returns: None
        example: |
          items: list[int] = [1, 2, 3]
          items.append(4)
          # items is now [1, 2, 3, 4]
        tags: [mutable, sequence, add]

      - name: pop
        signature: "list.pop(index: int = -1) -> T"
        description: Remove and return the item at the given index (default last).
        returns: T
        example: |
          items: list[int] = [1, 2, 3]
          last = items.pop()
          # last = 3, items is now [1, 2]
        tags: [mutable, sequence, remove]

      - name: extend
        signature: "list.extend(iterable: Iterable[T]) -> None"
        description: Extend the list by appending all items from the given iterable.
        returns: None
        example: |
          items: list[int] = [1, 2]
          items.extend([3, 4])
          # items is now [1, 2, 3, 4]
        tags: [mutable, sequence, add, bulk]

  - name: dict
    module: dict
    category: built-in
    description: Mutable mapping type for storing key-value pairs.
    methods:
      - name: get
        signature: "dict.get(key: K, default: V = None) -> V"
        description: Return the value for key if present, otherwise default.
        returns: V
        example: |
          d: dict[str, int] = {"a": 1, "b": 2}
          val = d.get("a", 0)
          # val is 1
        tags: [mapping, access, safe]

      - name: items
        signature: "dict.items() -> dict_items[tuple[K, V]]"
        description: Return a view object of key-value pairs.
        returns: dict_items[tuple[K, V]]
        example: |
          d: dict[str, int] = {"a": 1, "b": 2}
          for key, val in d.items():
              print(f"{key}={val}")
        tags: [mapping, iteration, view]

      - name: update
        signature: "dict.update(other: Mapping[K, V] | Iterable[tuple[K, V]]) -> None"
        description: Update the dict with key-value pairs from another mapping or iterable.
        returns: None
        example: |
          d: dict[str, int] = {"a": 1}
          d.update({"b": 2, "c": 3})
          # d is {"a": 1, "b": 2, "c": 3}
        tags: [mapping, mutable, bulk]

  - name: str
    module: str
    category: built-in
    description: Immutable sequence of Unicode characters for text data.
    methods:
      - name: split
        signature: "str.split(sep: str = None, maxsplit: int = -1) -> list[str]"
        description: Split the string by the given separator, returning a list of substrings.
        returns: list[str]
        example: |
          parts = "a,b,c".split(",")
          # parts is ["a", "b", "c"]
        tags: [string, parsing, split]

      - name: join
        signature: "str.join(iterable: Iterable[str]) -> str"
        description: Concatenate iterable elements with the string as separator.
        returns: str
        example: |
          result = ",".join(["a", "b", "c"])
          # result is "a,b,c"
        tags: [string, concatenation]

      - name: format
        signature: "str.format(*args, **kwargs) -> str"
        description: Perform string formatting using positional and keyword arguments.
        returns: str
        example: |
          result = "{} is {}".format("name", "value")
          # result is "name is value"
        tags: [string, formatting]

  - name: os
    module: os
    category: standard-library
    description: Operating system interfaces for file and process management.
    methods:
      - name: path.join
        signature: "os.path.join(*paths: str) -> str"
        description: Join one or more path components intelligently.
        returns: str
        example: |
          path = os.path.join("dir", "subdir", "file.txt")
          # path is "dir/subdir/file.txt"
        tags: [filesystem, path, cross-platform]

      - name: environ
        signature: "os.environ: dict[str, str]"
        description: Mapping representing the environment variables.
        returns: dict[str, str]
        example: |
          home = os.environ.get("HOME", "/default")
        tags: [environment, config]

      - name: listdir
        signature: "os.listdir(path: str = '.') -> list[str]"
        description: Return a list of entries in the given directory.
        returns: list[str]
        example: |
          files = os.listdir(".")
          # files is ["file1.txt", "file2.py", ...]
        tags: [filesystem, directory, listing]

  - name: json
    module: json
    category: standard-library
    description: JSON encoder and decoder for data serialization.
    methods:
      - name: dumps
        signature: "json.dumps(obj: Any, indent: int = None) -> str"
        description: Serialize an object to a JSON-formatted string.
        returns: str
        example: |
          data = {"key": "value", "num": 42}
          s = json.dumps(data, indent=2)
          # s is '{\n  "key": "value",\n  "num": 42\n}'
        tags: [serialization, json, encoding]

      - name: loads
        signature: "json.loads(s: str) -> Any"
        description: Deserialize a JSON-formatted string to a Python object.
        returns: Any
        example: |
          data = json.loads('{"key": "value"}')
          # data is {"key": "value"}
        tags: [serialization, json, decoding]

      - name: load
        signature: "json.load(fp: IO[str]) -> Any"
        description: Deserialize a JSON file-like object to a Python object.
        returns: Any
        example: |
          with open("data.json") as f:
              data = json.load(f)
        tags: [serialization, json, file, decoding]
