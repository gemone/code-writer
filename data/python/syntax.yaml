# Python Syntax Guide
# Minimal seed - comprehensive data auto-fetched via lang_fetch

sections:
  - title: Variables and Types
    description: >
      Python uses dynamic typing with optional type annotations (PEP 484).
      Type hints enable static analysis without runtime enforcement.
    topics:
      - title: Type Annotations
        description: "Type hints for variables, parameters, and return values."
        examples:
          - description: "Basic annotations"
            code: |
              name: str = "Alice"
              scores: list[int] = [95, 87, 92]
              config: dict[str, str] = {"host": "localhost"}
      - title: Optional and Union Types
        description: "Optional[X] is Union[X, None]. Use | syntax on 3.10+."
        examples:
          - description: "Optional and Union"
            code: |
              def find_user(user_id: int) -> str | None:
                  return "Alice" if user_id == 1 else None

              def process(value: int | str) -> str:
                  return str(value)
      - title: TypeVar and Generics
        description: "TypeVar for generic functions and classes."
        examples:
          - description: "Generic function"
            code: |
              from typing import TypeVar
              T = TypeVar("T")

              def first(items: list[T]) -> T:
                  return items[0]

              # Python 3.12+ shorthand
              def first[T](items: list[T]) -> T:
                  return items[0]

  - title: Functions
    description: >
      Functions are first-class objects with type hints, decorators,
      and flexible parameter styles (positional-only, keyword-only).
    topics:
      - title: Function Definitions
        description: "Functions with def, type hints, and default values."
        examples:
          - description: "Standard function"
            code: |
              def greet(name: str, greeting: str = "Hello") -> str:
                  return f"{greeting}, {name}!"

              greet("Alice")                    # "Hello, Alice!"
              greet("Bob", greeting="Hi")       # "Hi, Bob!"
      - title: Parameter Styles
        description: "Positional-only (/), keyword-only (*), mutable default pitfall."
        examples:
          - description: "Parameter kinds and mutable default"
            code: |
              def create_user(name: str, age: int, /) -> dict:
                  return {"name": name, "age": age}

              def configure(*, host: str, port: int = 5432) -> None: ...

              # CORRECT: use None for mutable defaults
              def append_item(item: int, items: list[int] | None = None) -> list[int]:
                  if items is None:
                      items = []
                  items.append(item)
                  return items
      - title: Decorators
        description: "Functions modifying other functions via @syntax."
        examples:
          - description: "Timer decorator with functools.wraps"
            code: |
              import functools, time
              from typing import Callable, TypeVar, ParamSpec
              P = ParamSpec("P"); T = TypeVar("T")

              def timer(func: Callable[P, T]) -> Callable[P, T]:
                  @functools.wraps(func)
                  def wrapper(*args: P.args, **kwargs: P.kwargs) -> T:
                      start = time.perf_counter()
                      result = func(*args, **kwargs)
                      print(f"{func.__name__}: {time.perf_counter() - start:.4f}s")
                      return result
                  return wrapper

              @timer
              def fetch_data(url: str) -> dict: ...

  - title: Classes
    description: >
      Python supports OOP with classes, inheritance, dataclasses, properties,
      and special methods (__init__, __repr__, etc.).
    topics:
      - title: Class Definition and Inheritance
        description: "Classes with __init__, inheritance via super()."
        examples:
          - description: "Inheritance chain"
            code: |
              class Animal:
                  def __init__(self, name: str, sound: str) -> None:
                      self.name = name; self.sound = sound
                  def speak(self) -> str:
                      return f"{self.name} says {self.sound}"

              class Dog(Animal):
                  def __init__(self, name: str) -> None:
                      super().__init__(name, "Woof")
                  def fetch(self, item: str) -> str:
                      return f"{self.name} fetches the {item}"
      - title: Dataclasses
        description: "Auto-generates __init__, __repr__, __eq__ from annotations."
        examples:
          - description: "Mutable and frozen dataclasses"
            code: |
              from dataclasses import dataclass, field

              @dataclass
              class User:
                  name: str
                  email: str
                  is_active: bool = True
                  tags: list[str] = field(default_factory=list)

              @dataclass(frozen=True, slots=True)
              class Point:
                  x: float; y: float
      - title: Properties and Methods
        description: "@property for managed access, @classmethod for alternate constructors."
        examples:
          - description: "Property with validation"
            code: |
              class Temperature:
                  def __init__(self, celsius: float = 0.0) -> None:
                      self._celsius = celsius

                  @property
                  def celsius(self) -> float:
                      return self._celsius

                  @celsius.setter
                  def celsius(self, value: float) -> None:
                      if value < -273.15:
                          raise ValueError("Below absolute zero")
                      self._celsius = value

                  @property
                  def fahrenheit(self) -> float:
                      return self._celsius * 9 / 5 + 32

  - title: Comprehensions
    description: >
      Concise syntax for creating lists, sets, and dicts.
      Generator expressions provide lazy evaluation for large datasets.
    topics:
      - title: List, Dict, and Set Comprehensions
        description: "Create collections from iterables with transforms and filters."
        examples:
          - description: "All comprehension forms"
            code: |
              squares = [x ** 2 for x in range(10)]
              evens = [x for x in range(20) if x % 2 == 0]
              flat = [n for row in [[1, 2], [3, 4]] for n in row]
              word_lengths = {w: len(w) for w in ["hello", "world"]}
              unique_lengths = {len(w) for w in ["hello", "world", "hi"]}
      - title: Generator Expressions
        description: "Lazy comprehensions using parentheses."
        examples:
          - description: "Generator expressions and functions"
            code: |
              total = sum(x ** 2 for x in range(1_000_000))
              max_val = max(x for x in numbers if x > 0)

              def fibonacci():
                  a, b = 0, 1
                  while True:
                      yield a; a, b = b, a + b

  - title: Context Managers
    description: >
      The with statement ensures setup and teardown always run.
      Use contextlib.contextmanager for function-based managers.
    topics:
      - title: Using and Creating Context Managers
        description: "Built-in with and @contextmanager decorator."
        examples:
          - description: "contextlib and class-based"
            code: |
              from contextlib import contextmanager

              with open("data.txt") as f:
                  content = f.read()

              @contextmanager
              def timer(label: str):
                  import time
                  start = time.perf_counter()
                  try: yield
                  finally: print(f"{label}: {time.perf_counter() - start:.4f}s")

              class DB:
                  def __enter__(self): return self
                  def __exit__(self, *args): self.close(); return False
