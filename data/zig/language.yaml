# Zig Language Metadata
# Code Standards Plugin - Language Reference

language:
  name: Zig
  version: "0.16.0"
  website: https://ziglang.org
  documentation: https://ziglang.org/documentation/master/
  repo: https://github.com/ziglang/zig
  extensions:
    - .zig
    - .zon
  aliases:
    - zig

  typing:
    system: static
    inference: true
    generics: true
    comptime: true

  paradigms:
    - imperative
    - systems
    - procedural
    - concurrent

  compilation:
    type: compiled
    target: native via LLVM with cross-compilation support
    backends:
      - LLVM
      - x86 (self-hosted)
      - aarch64 (self-hosted)
      - WebAssembly (self-hosted)
      - C backend

  runtime: "No GC, explicit allocator (passed as parameter), std.Io concurrency (threaded, evented, uring, kqueue, dispatch)"

  features:
    - comptime-evaluation
    - error-union-types
    - defer-errdefer
    - explicit-allocator
    - no-hidden-control-flow
    - optional-types
    - io-as-interface
    - juicy-main
    - cross-compilation
    - vector-types
    - packed-structs-unions
    - sentinel-terminated-pointers
    - compile-time-type-introspection

  ecosystem:
    package_manager: build.zig.zon (Zig Package Manager)
    build_system: build.zig (Zig Build System)
    testing: zig test (built-in)
    fuzzing: zig fuzz (built-in)
    formatter: zig fmt (built-in)
    linting: []

  versionFeatures:
    "0.16.0":
      - "I/O as an Interface (std.Io)"
      - "Juicy Main (std.process.Init)"
      - "@Type replaced with @Int, @Struct, @Union, @Enum, @Tuple, @Pointer, @Fn"
      - "@cImport deprecated, moved to build system"
      - "heap.ArenaAllocator thread-safe and lock-free"
      - "heap.ThreadSafeAllocator removed"
      - "Sync primitives migrated to std.Io (Mutex, Condition, RwLock, etc.)"
      - "All std.fs APIs migrated to std.Io"
      - "mem.indexOf renamed to mem.find"
      - "@floor/@ceil/@round/@trunc convert floats to integers"
      - "Small integer types coerce to floats"
      - "Packed unions support explicit backing integers"
      - "Deflate compression added to std.compress"
      - "AES-SIV, AES-GCM-SIV, Ascon-AEAD/Hash/CHash in std.crypto"
      - "std.process.spawn replaces std.process.Child.init"
      - "Migration to Unmanaged containers"
      - "LLVM 21"

  sources:
    stdlib:
      - pattern: "~/.zvm/{version}/lib/std/**/*.zig"
      - pattern: "~/.local/share/zvm/{version}/lib/std/**/*.zig"
      - pattern: "/usr/lib/zig/{version}/std/**/*.zig"
      - pattern: "/usr/local/lib/zig/{version}/std/**/*.zig"
      - pattern: "~/.local/share/zig/{version}/lib/std/**/*.zig"
    docs:
      - url: "https://ziglang.org/documentation/master/"
        scope: "stdlib"

  quickReference:

    variableDeclaration:
      description: "Declare variables with const (immutable) or var (mutable). Type inference supported. Use SCREAMING_SNAKE for comptime constants."
      example: |
        // Explicit types
        const x: u32 = 42;
        var counter: u32 = 0;

        // Type inference
        const name = "zig";

        // Optional
        var maybe: ?u32 = null;
        maybe = 42;
        if (maybe) |val| {
            // val is unwrapped to u32
        }

        // SCREAMING_SNAKE for comptime constants
        const MAX_SIZE: usize = 1024;

    functionDeclaration:
      description: "Functions use fn keyword. Parameters are immutable by default. Use !T for error unions. comptime for generic parameters."
      example: |
        // Basic function
        fn add(a: i32, b: i32) i32 {
            return a + b;
        }

        // Error union return
        fn read_file(alloc: std.mem.Allocator, path: []const u8) ![]u8 {
            const file = try std.fs.cwd().openFile(path, .{});
            defer file.close();
            return try file.readToEndAlloc(alloc, 1024 * 1024);
        }

        // Generic function via comptime
        fn max(comptime T: type, a: T, b: T) T {
            return if (a > b) a else b;
        }

    controlFlow:
      description: "if/else, for, while, and switch. if/while support optional unwrapping. switch is exhaustive. for supports ranges with 0..n."
      example: |
        // if/else (works as expression)
        const label = if (x > 0) "positive" else "non-positive";

        // Optional unwrapping in if
        if (maybe) |val| {
            use(val);
        }

        // for loops (iterate slices and ranges)
        for (items) |item| { process(item); }
        for (0..10) |i| { std.debug.print("{d}\n", .{i}); }

        // while with continue expression
        var i: u32 = 0;
        while (i < 10) : (i += 1) { /* ... */ }

        // Exhaustive switch
        switch (direction) {
            .north => "up",
            .south => "down",
            .east => "right",
            .west => "left",
        }

    structDeclaration:
      description: "Structs are value types with methods as functions taking self parameter. Use PascalCase. Generic via comptime functions returning struct type."
      example: |
        const Point = struct {
            x: f64,
            y: f64,

            pub fn distance(self: Point, other: Point) f64 {
                const dx = self.x - other.x;
                const dy = self.y - other.y;
                return @sqrt(dx * dx + dy * dy);
            }
        };

        const p = Point{ .x = 1.0, .y = 2.0 };

        // Tagged union
        const Value = union(enum) {
            integer: i64,
            float: f64,
            string: []const u8,
        };

        // Generic struct
        fn Stack(comptime T: type) type {
            return struct {
                items: std.ArrayList(T),
                pub fn init(alloc: Allocator) @This() {
                    return .{ .items = std.ArrayList(T).init(alloc) };
                }
            };
        }

    errorHandling:
      description: "Error unions (!Type) for explicit error handling. Use try to propagate, catch to handle, defer/errdefer for cleanup."
      example: |
        // Error set and error union
        const ParseError = error{ InvalidInput, Overflow };
        fn parse(s: []const u8) ParseError!u32 {
            return std.fmt.parseInt(u32, s, 10);
        }

        // Propagate with try
        const n = try parse("42");

        // Handle with catch
        const n = parse("abc") catch |err| {
            std.debug.print("error: {}\n", .{err});
            return 0;
        };

        // catch with default
        const n = parse("abc") catch 0;

        // defer / errdefer for cleanup
        fn process(alloc: std.mem.Allocator) !void {
            const buf = try alloc.alloc(u8, 1024);
            defer alloc.free(buf);        // always runs
            errdefer alloc.free(result);  // only on error
        }

    memory:
      description: "All allocation is explicit via Allocator parameter. In 0.16, use init.gpa from Juicy Main. ArenaAllocator is thread-safe."
      example: |
        // Juicy Main (0.16) — allocators and I/O from init
        pub fn main(init: std.process.Init) !void {
            const gpa = init.gpa;
            const io = init.io;
            const alloc = init.arena.allocator();

            var list = std.ArrayList(u8).init(gpa);
            defer list.deinit(gpa);
            try list.append(gpa, 'h');
        }

        // Testing with leak detection
        test "no leaks" {
            const alloc = std.testing.allocator;
            const buf = try alloc.alloc(u8, 100);
            defer alloc.free(buf);
        }

    io:
      description: "In 0.16, all I/O requires an Io instance from std.process.Init. Use std.testing.io in tests."
      example: |
        // I/O in main
        pub fn main(init: std.process.Init) !void {
            const io = init.io;
            const gpa = init.gpa;

            // File I/O via Io
            const file = try io.cwd().openFile("data.txt", .{});
            defer file.close(io);

            // Networking via Io
            var http_client: std.http.Client = .{ .allocator = gpa, .io = io };
            defer http_client.deinit();
        }

        // Testing I/O
        test "file operations" {
            const io = std.testing.io;
            // ... use io for file operations
        }

        // Standalone Io (when no init available)
        var threaded: std.Io.Threaded = .init_single_threaded;
        const io = threaded.io();
