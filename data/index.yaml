version: 1
languages:
  typescript:
    name: TypeScript
    version: '5.7'
    extensions:
      - .ts
      - .tsx
      - .mts
      - .cts
    aliases:
      - ts
      - tsx
    dataDir: typescript
    tags:
      - static-typing
      - javascript-superset
      - web
  python:
    name: Python
    version: '3.13'
    extensions:
      - .py
      - .pyi
      - .pyw
    aliases:
      - py
      - python3
    dataDir: python
    tags:
      - dynamic-typing
      - scripting
      - data-science
  zig:
    name: Zig
    version: '0.16'
    extensions:
      - .zig
      - .zon
    aliases: []
    dataDir: zig
    tags:
      - systems-programming
      - manual-memory
      - comptime
