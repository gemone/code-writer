version: "1"
patterns:
  - name: "Error Handling"
    category: "reliability"
    description: "Provide a structured way to handle errors that separates error detection from error handling, making code more robust and maintainable."
    when: |
      When performing I/O operations (file, network, database)
      When parsing external data (JSON, XML, user input)
      When calling external services or APIs
      When operations may fail for expected reasons
    example: |
      try {
        const data = JSON.parse(input);
        return process(data);
      } catch (err) {
        if (err instanceof SyntaxError) {
          logger.warn("Invalid JSON input", { input });
          return fallbackValue;
        }
        throw err; // re-throw unexpected errors
      }
    relatedPatterns: ["Result Type", "Option Type", "Circuit Breaker"]

  - name: "Iterator"
    category: "behavioral"
    description: "Provide a way to access elements of a collection sequentially without exposing its underlying representation."
    when: |
      When you need to traverse a collection without exposing its internal structure
      When you need multiple ways to traverse the same collection
      When you want a uniform interface for different collection types
    example: |
      for (const item of collection) {
        if (item.matches(filter)) {
          yield transform(item);
        }
      }
    relatedPatterns: ["Composite", "Factory Method"]

  - name: "Observer"
    category: "behavioral"
    description: "Define a one-to-many dependency between objects so that when one object changes state, all its dependents are notified and updated automatically."
    when: |
      When changes to one object require changing others
      When an object should notify others without knowing who they are
      When implementing event-driven architectures
    example: |
      emitter.on("data", (event) => {
        pipeline.process(event.payload);
      });
      emitter.on("error", (event) => {
        logger.error("Pipeline failed", { error: event.error });
      });
    relatedPatterns: ["Mediator", "Event Bus"]

  - name: "Strategy"
    category: "behavioral"
    description: "Define a family of algorithms, encapsulate each one, and make them interchangeable. Strategy lets the algorithm vary independently from clients that use it."
    when: |
      When you have multiple algorithms for a specific task
      When you want to select algorithms at runtime
      When you want to isolate algorithm implementation from usage
    example: |
      interface SortStrategy {
        sort<T>(items: T[]): T[];
      }
      function sortList<T>(items: T[], strategy: SortStrategy): T[] {
        return strategy.sort([...items]);
      }
    relatedPatterns: ["Factory Method", "State", "Template Method"]
