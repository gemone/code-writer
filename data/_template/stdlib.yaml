# Standard Library Template
# Copy this file to data/<language>/stdlib.yaml and fill in the details

version: "1"
modules:
  - module: "{{MODULE_NAME}}"
    category: "{{CATEGORY}}"
    description: "{{DESCRIPTION}}"
    methods:
      - name: "{{METHOD_NAME}}"
        signature: "{{SIGNATURE}}"
        description: "{{DESCRIPTION}}"
        returns: "{{RETURN_TYPE}}"
        example: |
          {{EXAMPLE_CODE}}
        tags: ["{{TAG}}"]

  # Example:
  - module: collections
    category: data-structures
    description: Common collection data types.
    methods:
      - name: Counter
        signature: "Counter(iterable: Iterable[T]) -> Counter[T]"
        description: Count occurrences of elements in an iterable.
        returns: Counter[T]
        example: |
          from collections import Counter
          counts = Counter(["apple", "banana", "apple"])
          # Counter({'apple': 2, 'banana': 1})
        tags: [collections, counting, builtin]
