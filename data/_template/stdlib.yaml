        returns:
          type: "Promise<string>"
          description: "The file contents as a string"
        examples:
          - code: |
              const content = await fs.readFile('/path/to/file.txt');
              console.log(content);
            description: "Read a file with default encoding"
          - code: |
              const content = await fs.readFile('/path/to/file.txt', 'latin1');
              console.log(content);
            description: "Read a file with specific encoding"
        throws:
