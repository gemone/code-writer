  # Example convention:
  - id: "naming-camelCase"
    name: "Use camelCase for variables and functions"
    severity: "warn"
    description: "Variables and functions should use camelCase naming convention."
    category: "naming"
    rule: "Use camelCase for variable and function names"
    examples:
      bad:
        - "const user_name = 'John';"
        - "function get_user() { ... }"
      good:
        - "const userName = 'John';"
        - "function getUser() { ... }"
    autofix: false
    references:
      - "https://google.github.io/styleguide/tsguide.html#naming"

