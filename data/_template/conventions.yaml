namingConventions:
  # TODO: Define language-specific naming conventions
  variables:
    rule: "camelCase"
    examples: ["userName", "totalCount", "isActive"]

  functions:
    rule: "camelCase with verb phrases"
    examples: ["getUser", "calculateTotal", "isValid"]

  classes:
    rule: "PascalCase"
    examples: ["UserService", "HttpClient", "DatabaseConnection"]

  constants:
    rule: "UPPER_SNAKE_CASE"
    examples: ["MAX_RETRY_COUNT", "API_BASE_URL", "DEFAULT_TIMEOUT"]

  interfaces:
    rule: "PascalCase"
    examples: ["User", "ApiResponse", "Config"]

  enums:
    rule: "PascalCase for type, UPPER_SNAKE_CASE for values"
    examples:
      type: "UserRole"
      values: ["ADMIN", "USER", "GUEST"]
