# Conventions Template
# Copy this file to data/<language>/conventions.yaml and fill in the details

version: "1"
conventions:
  - name: "{{CONVENTION_NAME}}"
    severity: warn  # "error", "warn", or "info"
    rule: "{{THE_RULE_TO_FOLLOW}}"
    example:
      good: "{{GOOD_EXAMPLE}}"
      bad: "{{BAD_EXAMPLE}}"
    rationale: "{{WHY_THIS_CONVENTION_EXISTS}}"

  # Example:
  - name: Use camelCase for variables and functions
    severity: warn
    rule: >
      Variable and function names MUST use camelCase. Class names MUST use
      PascalCase. Constants MUST use UPPER_SNAKE_CASE.
    example:
      good: |
        const userName = "Alice";
        function getUser() { return userName; }
        const MAX_RETRIES = 3;
      bad: |
        const user_name = "Alice";
        function get_user() { return user_name; }
        const maxRetries = 3;
    rationale: >
      Consistent naming improves readability and follows the dominant community
      style guide.

  - name: Prefer const over let
    severity: warn
    rule: >
      Use const for all bindings that are not reassigned. Use let only when
      reassignment is necessary. Never use var.
    example:
      good: |
        const name = "Alice";
        let count = 0;
        count += 1;
      bad: |
        var name = "Alice";
        let name = "Alice";
    rationale: >
      const signals intent and prevents accidental reassignment, making code
      easier to reason about.
