version: "1"
patterns:
  - name: "{{PATTERN_NAME}}"
    category: "{{CATEGORY}}"
    description: "{{DESCRIPTION_OF_WHAT_THE_PATTERN_DOES}}"
    when: "{{WHEN_TO_USE_THIS_PATTERN}}"
    example: |
      {{EXAMPLE_CODE}}
    relatedPatterns:
      - "{{RELATED_PATTERN_1}}"
      - "{{RELATED_PATTERN_2}}"

  # Example:
  - name: Builder Pattern
    category: creational
    description: >
      Separates object construction from its representation, allowing the same
      construction process to create different representations.
    when: >
      When an object has many optional parameters or complex initialization
      logic that would make a constructor unwieldy.
    example: |
      class QueryBuilder:
          def __init__(self) -> None:
              self._query: dict[str, object] = {}

          def select(self, *fields: str) -> "QueryBuilder":
              self._query["select"] = fields
              return self

          def where(self, condition: str) -> "QueryBuilder":
              self._query["where"] = condition
              return self

          def build(self) -> dict[str, object]:
              return self._query

      query = QueryBuilder().select("name", "age").where("age > 18").build()
    relatedPatterns:
      - Factory Method
      - Abstract Factory
