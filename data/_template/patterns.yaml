  # Example pattern:
  - id: "dependency-injection"
    name: "Dependency Injection"
    category: "creational"
    intent: "Decouple objects from their dependencies by injecting dependencies rather than creating them internally."
    when_to_use:
      - "When you want to decouple classes from their dependencies"
      - "When you need to swap implementations (e.g., for testing)"
      - "When dependencies have complex initialization"
    when_to_avoid:
      - "When dependencies are simple and stable"
      - "When it adds unnecessary complexity"
    structure:
      - component: "Container"
        description: "Manages dependency registration and resolution"
      - component: "Injectable"
        description: "Interface or decorator marking classes as injectable"
      - component: "Token"
        description: "Unique identifier for dependencies"
    implementation:
      description: "Implement using decorators and a container class"
      code: |
        // Token for dependency identification
        const TOKENS = {
          Logger: Symbol('Logger'),
          Database: Symbol('Database'),
        };

        // Simple container
        class Container {
          private bindings = new Map<symbol, any>();

          bind<T>(token: symbol, implementation: T): void {
            this.bindings.set(token, implementation);
          }

          resolve<T>(token: symbol): T {
            return this.bindings.get(token);
          }
        }

        // Usage with decorators
        function Injectable(token: symbol) {
          return function (target: any) {
            // Register with container
          };
        }
    usage:
      description: "Register dependencies and inject them into classes"
      code: |
        const container = new Container();
        container.bind(TOKENS.Logger, new ConsoleLogger());
        container.bind(TOKENS.Database, new PostgresDatabase());

        const userService = new UserService(
          container.resolve(TOKENS.Logger),
          container.resolve(TOKENS.Database)
        );
    related_patterns:
      - "Factory Method"
      - "Singleton"
      - "Service Locator"
    references:
      - "https://en.wikipedia.org/wiki/Dependency_injection"

