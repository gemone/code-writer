# Syntax Template
# Copy this file to data/<language>/syntax.yaml and fill in the details

version: "1"
sections:
  - name: "{{SECTION_NAME}}"
    topics:
      - title: "{{TOPIC_NAME}}"
        description: "{{DESCRIPTION}}"
        examples:
          - code: "{{EXAMPLE_CODE}}"
            description: "{{DESCRIPTION}}"

  # Example:
  - name: Variables and Types
    topics:
      - title: Variable Declaration
        description: How to declare and initialize variables.
        examples:
          - code: |
              x: int = 42
              name: str = "hello"
            description: "Basic variable declarations with type annotations"
      - title: Constants
        description: How to define compile-time or module-level constants.
        examples:
          - code: |
              MAX_RETRIES: int = 3
            description: "Module-level constant"
