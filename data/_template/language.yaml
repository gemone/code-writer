# Language Template
# Copy this file to data/<language>/language.yaml and fill in the details

language:
  name: "{{LANGUAGE_NAME}}"
  version: "{{VERSION}}"
  website: "{{WEBSITE}}"
  repo: "{{REPO_URL}}"
  description: |
    {{BRIEF_DESCRIPTION_OF_THE_LANGUAGE}}

  paradigms:
    - "{{PARADIGM_1}}"
    - "{{PARADIGM_2}}"

  typeSystem:
    "{{TYPE_FEATURE_1}}": "{{DESCRIPTION}}"
    "{{TYPE_FEATURE_2}}": "{{DESCRIPTION}}"

  runtime: "{{RUNTIME}}"
  packageManager: "{{PACKAGE_MANAGER}}"

  quickReference:
    variableDeclaration: |
      {{EXAMPLE}}
    functionDeclaration:
      description: "{{DESCRIPTION}}"
      example: |
        {{EXAMPLE}}
